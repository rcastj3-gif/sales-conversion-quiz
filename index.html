<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sales Conversion Diagnostic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 28px; margin-bottom: 5px; color: #2c3e50; }
        .subtitle { color: #666; font-size: 16px; margin-bottom: 10px; }
        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s;
        }
        .question { display: none; }
        .question.active { display: block; }
        .question h3 { font-size: 20px; margin-bottom: 20px; color: #2c3e50; }
        .option { 
            display: block;
            padding: 16px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .option:hover { 
            background: #e9ecef;
            border-color: #667eea;
        }
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: 2px solid #ddd; 
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background: #5a6fd6; }
        .result { display: none; padding: 30px; background: #f8f9fa; border-radius: 12px; margin-top: 20px; }
        .result.active { display: block; }
        .cta-button {
            display: block;
            padding: 18px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Sales Conversion Diagnostic</h1>
        <p class="subtitle">10 questions. 3 minutes. Personalized assessment.</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div id="quiz-container"></div>
        <div id="result-container"></div>
    </div>

    <script>
// Quiz Data
const quizData = {
    questions: [
        {
            id: 1,
            text: "What's your biggest challenge with sales conversion?",
            options: [
                { text: "Rushing to pitch without understanding pain", value: "discovery", score: 0 },
                { text: "Price resistance on every call", value: "objection", score: 0 },
                { text: "Leads going cold after first contact", value: "followup", score: 0 }
            ]
        },
        {
            id: 2,
            text: "How long have you been dealing with this?",
            options: [
                { text: "Less than 6 months", value: "short", score: 2 },
                { text: "6-12 months", value: "medium", score: 5 },
                { text: "Over a year", value: "long", score: 8 }
            ]
        },
        {
            id: 3,
            text: "What's this costing you monthly in lost revenue?",
            options: [
                { text: "Under $1,000", value: "low", score: 2 },
                { text: "$1,000 - $5,000", value: "mid", score: 5 },
                { text: "Over $5,000", value: "high", score: 10 }
            ]
        },
        {
            id: 4,
            text: "What have you already tried to fix this?",
            options: [
                { text: "Free content and DIY", value: "diy", score: 3 },
                { text: "Courses and templates", value: "courses", score: 5 },
                { text: "Hired help - still stuck", value: "hired", score: 8 }
            ]
        },
        {
            id: 5,
            text: "If nothing changes in 6 months, what happens?",
            options: [
                { text: "I'll figure it out eventually", value: "optimistic", score: 2 },
                { text: "I'll have to make major changes", value: "realistic", score: 5 },
                { text: "Business/personal disaster", value: "urgent", score: 10 }
            ]
        },
        {
            id: 6,
            text: "Are you ready to invest time and money to fix this in the next 30 days?",
            options: [
                { text: "Yes, I'm committed", value: "committed", score: 15, action: "continue" },
                { text: "Maybe, still exploring", value: "maybe", score: 5, action: "nurture" },
                { text: "No, just curious", value: "no", score: 0, action: "content" }
            ]
        },
        {
            id: 7,
            text: "What's your current monthly revenue?",
            options: [
                { text: "Under $5,000", value: "under5k", score: 0 },
                { text: "$5,000 - $20,000", value: "5to20k", score: 5 },
                { text: "Over $20,000", value: "over20k", score: 10 }
            ]
        },
        {
            id: 8,
            text: "What's your comfort level for investment in solving this?",
            options: [
                { text: "Under $1,000", value: "under1k", score: 0 },
                { text: "$1,000 - $5,000", value: "1to5k", score: 5 },
                { text: "$5,000+", value: "over5k", score: 10 }
            ]
        },
        {
            id: 9,
            text: "What's your first name?",
            type: "input",
            field: "name",
            placeholder: "First name"
        },
        {
            id: 10,
            text: "What's your best email for your personalized diagnostic?",
            type: "input",
            field: "email",
            placeholder: "your@email.com"
        }
    ]
};

// State
let currentQuestion = 0;
let answers = [];
let totalScore = 0;
let userAction = 'continue';

// Initialize
function init() {
    renderQuestion();
    updateProgress();
}

// Render current question
function renderQuestion() {
    const container = document.getElementById('quiz-container');
    const question = quizData.questions[currentQuestion];
    
    if (!question) {
        showResult();
        return;
    }
    
    let html = `<div class="question active" id="q${question.id}">`;
    html += `<h3>Q${currentQuestion + 1}: ${question.text}</h3>`;
    
    if (question.type === 'input') {
        html += `<input type="${question.field === 'email' ? 'email' : 'text'}" id="${question.field}" placeholder="${question.placeholder}">`;
        html += `<button onclick="handleInput()">${question.field === 'email' ? 'Get My Result' : 'Continue'}</button>`;
    } else {
        question.options.forEach((opt, idx) => {
            html += `<div class="option" onclick="handleOption(${idx})">${opt.text}</div>`;
        });
    }
    
    html += '</div>';
    container.innerHTML = html;
}

// Handle option click
function handleOption(optionIndex) {
    const question = quizData.questions[currentQuestion];
    const option = question.options[optionIndex];
    
    answers.push({
        question: question.id,
        answer: option.value,
        score: option.score || 0
    });
    
    if (option.score) totalScore += option.score;
    if (option.action) userAction = option.action;
    
    console.log('Selected:', option.value, 'Score:', option.score, 'Action:', option.action);
    
    // Handle early exit for non-committed users
    if (option.action === 'content' || option.action === 'nurture') {
        showResult();
        return;
    }
    
    currentQuestion++;
    renderQuestion();
    updateProgress();
}

// Handle input fields
function handleInput() {
    const question = quizData.questions[currentQuestion];
    const input = document.getElementById(question.field);
    
    if (!input || !input.value.trim()) return;
    
    answers.push({
        question: question.id,
        answer: input.value,
        field: question.field
    });
    
    if (question.field === 'email') {
        showResult();
    } else {
        currentQuestion++;
        renderQuestion();
        updateProgress();
    }
}

// Update progress bar
function updateProgress() {
    const progress = ((currentQuestion) / quizData.questions.length) * 100;
    document.getElementById('progress').style.width = progress + '%';
}

// Show result
function showResult() {
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('progress').style.width = '100%';
    
    let resultType = '';
    let resultTitle = '';
    let resultText = '';
    
    if (userAction === 'content') {
        resultType = 'content';
        resultTitle = '📖 Free Resources';
        resultText = 'Here are some articles that might help you understand your challenges better.';
    } else if (userAction === 'nurture') {
        resultType = 'nurture';
        resultTitle = '📧 Stay Connected';
        resultText = "Thanks for your interest! You'll receive valuable content to help with your challenges.";
    } else if (totalScore >= 25) {
        resultType = 'hot';
        resultTitle = '🔥 Hot Lead - Priority Follow-up';
        resultText = 'Your diagnostic shows high intent and readiness. You qualify for a direct strategy call.';
    } else if (totalScore >= 15) {
        resultType = 'warm';
        resultTitle = '⚡ Warm Lead - Nurture Sequence';
        resultText = "You're interested but need more information. Check your email for valuable resources.";
    } else {
        resultType = 'cold';
        resultTitle = '📚 Content Recommendation';
        resultText = 'Based on your responses, here are some free resources to help you get started.';
    }
    
    const container = document.getElementById('result-container');
    let html = `<div class="result active">`;
    html += `<h2>${resultTitle}</h2>`;
    html += `<p>Score: ${totalScore} points</p>`;
    html += `<p>${resultText}</p>`;
    
    if (resultType === 'hot') {
        html += `<a href="https://calendly.com/reyescastillo/sales-diagnostic" class="cta-button">Book Your Strategy Call - $3,497</a>`;
    }
    
    html += `</div>`;
    container.innerHTML = html;
    
    // Store lead
    storeLead(resultType);
}

// GlobalControl Integration
const GC_CONFIG = {
    apiKey: '732716848f927cfaf4399bc92e4ecdd3dac1a020a92cf366fb26d3ae7f990825',
    apiUrl: 'https://app.globalcontrol.com/api/v1'
};

async function sendToGlobalControl(leadData) {
    const payload = {
        email: leadData.email,
        first_name: leadData.name.split(' ')[0],
        last_name: leadData.name.split(' ').slice(1).join(' ') || '',
        tags: ['quiz-taken', `result-${leadData.result}`, 'sales-conversion-quiz'],
        custom_fields: {
            quiz_result: leadData.result,
            quiz_score: leadData.score,
            quiz_date: leadData.date
        }
    };
    
    try {
        const response = await fetch(`${GC_CONFIG.apiUrl}/contacts`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${GC_CONFIG.apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });
        
        if (response.ok) {
            console.log('✓ Lead sent to GlobalControl');
            return true;
        } else {
            console.error('GlobalControl error:', response.status);
            return false;
        }
    } catch (error) {
        console.error('Network error:', error);
        return false;
    }
}

// Store lead locally and send to GlobalControl
async function storeLead(resultType) {
    const nameInput = answers.find(a => a.field === 'name');
    const emailInput = answers.find(a => a.field === 'email');
    
    if (!emailInput || !emailInput.answer) {
        console.log('No email captured');
        return;
    }
    
    const lead = {
        name: nameInput ? nameInput.answer : 'Anonymous',
        email: emailInput.answer,
        result: resultType,
        score: totalScore,
        date: new Date().toISOString()
    };
    
    // Send to GlobalControl
    const gcSuccess = await sendToGlobalControl(lead);
    
    // Also store locally as backup
    const leads = JSON.parse(localStorage.getItem('quiz_leads') || '[]');
    leads.push({...lead, gc_synced: gcSuccess});
    localStorage.setItem('quiz_leads', JSON.stringify(leads));
    
    if (gcSuccess) {
        showStorageConfirmation('✓ Your result has been saved. Check your email for next steps.');
    } else {
        showStorageConfirmation('✓ Result saved. We will follow up shortly.');
    }
}

function showStorageConfirmation(message) {
    const container = document.getElementById('result-container');
    const confirmation = document.createElement('div');
    confirmation.style.cssText = 'margin-top: 20px; padding: 15px; background: #d4edda; border-radius: 8px; color: #155724;';
    confirmation.innerHTML = message || '✓ Your result has been saved.';
    container.appendChild(confirmation);
}

// Admin function to view leads (type viewLeads() in console)
function viewLeads() {
    const leads = JSON.parse(localStorage.getItem('quiz_leads') || '[]');
    console.table(leads);
    return leads;
}

function exportLeads() {
    const leads = JSON.parse(localStorage.getItem('quiz_leads') || '[]');
    if (leads.length === 0) {
        console.log('No leads to export');
        return;
    }
    
    const headers = ['Name', 'Email', 'Result', 'Score', 'Date'];
    const rows = leads.map(l => [l.name, l.email, l.result, l.score, l.date]);
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `quiz-leads-${new Date().toISOString().split('T')[0]}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    
    console.log(`Exported ${leads.length} leads`);
}

// Start
init();
    </script>
</body>
</html>
